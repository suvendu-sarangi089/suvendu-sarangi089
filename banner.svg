<svg width="100%" height="250" viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0083B0" />
      <stop offset="100%" style="stop-color:#00B46F" />
    </linearGradient>
  </defs>

  <rect width="1200" height="250" fill="url(#grad)" />

  <!-- Moving Wave -->
  <path d="M0 150 Q 300 200 600 150 T 1200 150 V 250 H 0 Z" fill="rgba(255,255,255,0.15)">
    <animate 
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
        M0 150 Q 300 200 600 150 T 1200 150 V 250 H 0 Z;
        M0 160 Q 300 140 600 170 T 1200 160 V 250 H 0 Z;
        M0 150 Q 300 200 600 150 T 1200 150 V 250 H 0 Z
      "
    />
  </path>
</svg>

